<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوت‌نامه همایش سراسری بیمه کارآفرین</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- صفحه اول: ویدئو و ورود کد ملی -->
    <div id="page-home" class="page active">
        <div class="home-container">
            <!-- لوگوی بیمه کارآفرین -->
            <img src="logo.png" alt="لوگو بیمه کارآفرین" class="top-logo">
            
            <!-- ویدئو با قابلیت پخش خودکار و بی‌صدا -->
            <div class="video-wrapper">
                <video id="intro-video" src="home-anim.mp4" autoplay muted playsinline></video>
            </div>

            <!-- بخش ورود کد ملی (ابتدا مخفی) -->
            <div id="form-container" class="hidden-section">
                <p class="instruction-text">میهمان گرامی، لطفا جهت مشاهده دعوت‌نامه خود، کدملی خود را وارد کنید:</p>
                
                <form id="national-id-form" onsubmit="event.preventDefault(); checkNationalId();">
                    <input 
                        type="text" 
                        id="national-id-input" 
                        maxlength="10" 
                        placeholder="کد ملی ۱۰ رقمی"
                        inputmode="numeric"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                    >
                    <button type="submit">مشاهده دعوت‌نامه</button>
                </form>
                
                <div id="error-message" class="error-msg"></div>
            </div>
        </div>
    </div>

    <!-- صفحه دوم: نمایش کارت دعوت و نقشه -->
    <div id="page-invitation" class="page">
        <!-- دکمه بازگشت شناور در بالا سمت راست -->
        <button class="back-btn" onclick="goBackToHome()">بازگشت</button>

        <div class="invitation-layout-container">
            
            <!-- کارت دعوت در مرکز صفحه -->
            <div class="card-wrapper">
                <img src="invation.jpg" alt="کارت دعوت" class="invitation-img">
                <div id="guest-name" class="guest-name-overlay"></div>
            </div>

            <!-- مجموعه دو نقشه زیر کارت دعوت -->
            <div class="maps-container-wrapper">
                
                <!-- نقشه سمت راست: هتل پارسیان خزر -->
                <div class="map-item">
                    <div class="map-title-tag">اقامت: هتل پارسیان خزر نمک آبرود</div>
                    <a href="https://www.google.com/maps/place//data=!4m2!3m1!1s0x3f8c03a97cf2fb4d:0x4e799c698c8684f7?sa=X&ved=1t:8290&ictx=111" 
                       target="_blank" 
                       class="map-widget-box" 
                       title="مشاهده موقعیت هتل در گوگل مپ">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3224.5!2d51.4!3d35.7!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3f8c03a97cf2fb4d%3A0x4e799c698c8684f7!2sParsian%20Caspian%20Hotel!5e0!3m2!1sen!2sfa!4v1650000000000!5m2!1sen!2sfa" 
                            width="100%" 
                            height="100%" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy" 
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                        <div class="map-overlay-click"></div>
                    </a>
                </div>

                <!-- نقشه سمت چپ: سالن پانوراما کلارآباد -->
                <div class="map-item">
                    <div class="map-title-tag">اختتامیه: سالن پانوراما کلارآباد</div>
                    <a href="https://maps.app.goo.gl/Y4AtDXXsikFwSnXDA" 
                       target="_blank" 
                       class="map-widget-box" 
                       title="مشاهده موقعیت سالن جشنواره در گوگل مپ">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3198.994353795116!2d51.26622782443518!3d36.69867357341636!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3f8c03005ec9da15%3A0x4e8936d45c541ab7!2z2LPYp9mE2YYg2qnZhtiz2LHYqiDZiCDZh9mF2KfbjNi0INmF2LHaqdiyINiq2KzYp9ix24wg2b7Yp9mG2YjYsdin2YXYpw!5e0!3m2!1sfa!2sde!4v1794229573368!5m2!1sfa!2sde" 
                            width="100%" 
                            height="100%" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy" 
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                        <div class="map-overlay-click"></div>
                    </a>
                </div>

            </div>

        </div>
    </div>

    <script src="guests.js"></script>
    <script src="script.js"></script>
</body>
</html>
